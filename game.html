<title>Bubble Lagoon</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: one-screen phone app — name + stats strip, a glass board that fills the remaining height, a thumb-reach control bar with the rainbow stash in the middle. One deliberate deep-lagoon look (single theme). */
:root{
  --abyss:#05141f;
  --deep:#0a2f42;
  --lagoon:#11586a;
  --shallow:#1d8a92;
  --foam:#eafbf6;
  --mist:rgba(234,251,246,.66);
  --sun:#ffd166;
  --glass:rgba(255,255,255,.06);
  --line:rgba(255,255,255,.13);
  --rainbow:conic-gradient(from 0deg,#ff2e63,#ffb300,#14d36b,#1e88ff,#9a3dff,#ff2e63);
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{
  background:var(--abyss);
  background-image:radial-gradient(140% 80% at 50% -10%,var(--shallow) 0%,var(--lagoon) 30%,var(--deep) 62%,var(--abyss) 100%);
  color:var(--foam);font-family:var(--body);
  overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
}
#bg{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
/* World backdrops: two layers crossfade; a tint keeps bubbles and header text readable. */
.scene{position:fixed;inset:0;pointer-events:none;--tint:.3}
.scene div{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 1.4s ease}
.scene div.on{opacity:1}
.scene::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,16,26,calc(var(--tint) + .3)) 0%,rgba(4,16,26,var(--tint)) 20%,rgba(4,16,26,var(--tint)) 80%,rgba(4,16,26,calc(var(--tint) + .25)) 100%)}
@media (prefers-reduced-motion:reduce){.scene div{transition:none}}
.app{
  position:relative;height:100%;box-sizing:border-box;
  display:flex;flex-direction:column;gap:10px;
  max-width:560px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:12px;
}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{
  font-family:var(--display);font-weight:800;font-size:clamp(1.5rem,6.4vw,2.2rem);line-height:1;margin:0;letter-spacing:-.01em;
  background:linear-gradient(100deg,#eafbf6 0%,#9ff3ff 30%,#ffd166 55%,#ff9ec0 75%,#eafbf6 100%);
  background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:shimmer 9s linear infinite;
}
.stats{display:flex;gap:14px}
.stat{display:flex;flex-direction:column;align-items:flex-end}
.label{font-size:.66rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--mist)}
.num{font-family:var(--display);font-weight:800;font-size:1.4rem;line-height:1.1;font-variant-numeric:tabular-nums}
.info{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:.86rem;color:var(--mist);min-height:1.3em}
#tip{min-width:0;transition:color .3s}
#tip.flash{color:var(--sun)}
.info .count{white-space:nowrap}
.info b{color:var(--foam)}
.board{flex:1;min-height:0;position:relative}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
.bar{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
button{
  position:relative;
  font:800 .78rem var(--body);color:var(--foam);
  background:var(--glass);border:1px solid var(--line);border-radius:16px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 6px 16px rgba(0,0,0,.25);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  padding:10px 2px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;
  transition:transform .12s ease,opacity .2s,box-shadow .3s;
}
button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
button:active{transform:scale(.94)}
button:disabled{opacity:.38}
button:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
.orb{width:22px;height:22px;border-radius:50%;background:var(--rainbow);box-shadow:inset -2px -3px 5px rgba(0,0,0,.2);animation:spin 5s linear infinite}
#rbBtn{border-color:rgba(255,220,250,.35)}
#bmBtn{border-color:rgba(255,170,110,.35)}
#rbBtn:disabled .orb{filter:grayscale(1);animation:none}
#bmBtn:disabled svg{filter:grayscale(1)}
#rbBtn.armed,#bmBtn.armed{box-shadow:0 0 0 2px #fff,0 0 22px rgba(255,210,180,.6);animation:pulse 1s ease-in-out infinite}
.bombicon .body{fill:#2e3247;stroke:#8a90a8;stroke-width:1.5}
.bombicon .spark{stroke:#ffc23d}
.right{display:flex;align-items:center;gap:12px}
.iconbtn{padding:8px;border-radius:50%}
.iconbtn svg{width:20px;height:20px}
.badge{position:absolute;top:-7px;right:-3px;min-width:20px;height:20px;box-sizing:border-box;border-radius:10px;padding:0 6px;background:var(--sun);color:var(--abyss);font:800 .74rem/20px var(--body);font-variant-numeric:tabular-nums}
.badge.bump{animation:bump .5s cubic-bezier(.2,1.8,.4,1)}
.fly{position:fixed;left:0;top:0;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;background:var(--rainbow);box-shadow:0 0 30px rgba(255,255,255,.8);pointer-events:none;z-index:5;transition:transform .85s cubic-bezier(.45,-0.35,.35,1),opacity .85s ease-in}
.fly.bomb{background:radial-gradient(circle at 35% 30%,#5d6480,#1a1c2a 75%);box-shadow:0 0 24px rgba(255,150,60,.8)}

.overlay{
  position:fixed;inset:0;display:grid;place-items:center;z-index:4;
  background:rgba(3,14,22,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
}
.card{
  width:100%;max-width:340px;box-sizing:border-box;text-align:center;
  background:linear-gradient(180deg,rgba(29,138,146,.55),rgba(10,47,66,.92) 55%,rgba(5,20,31,.96));
  border:1px solid var(--line);border-radius:28px;padding:28px 22px 20px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 24px 60px rgba(0,0,0,.5);
  animation:rise .45s cubic-bezier(.2,1.3,.4,1) both;
}
.card h2{font-family:var(--display);font-weight:800;font-size:2rem;line-height:1.05;margin:0;text-wrap:balance}
.card p{margin:8px 0 0;color:var(--mist);line-height:1.45}
.pearls{display:flex;gap:16px;justify-content:center;margin:20px 0 6px}
.pearl{width:38px;height:38px;border-radius:50%;background:rgba(234,251,246,.08);box-shadow:inset 0 0 0 2px rgba(234,251,246,.18)}
.pearl.on{
  background:radial-gradient(circle at 34% 30%,#fff 0 10%,#f7f0e8 28%,#ddcfc0 72%,#b8a594 100%);
  box-shadow:0 0 22px rgba(255,238,215,.55);
  animation:pearl .55s cubic-bezier(.2,1.6,.4,1) both;
}
.pearl.on:nth-child(2){animation-delay:.15s}
.pearl.on:nth-child(3){animation-delay:.3s}
.pearl-note{font-size:.8rem;color:var(--mist)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.actions button,.wide{flex-direction:row;justify-content:center;font-size:.95rem;padding:13px 8px}
.wide{width:100%;margin-top:10px;gap:8px}
.actions .primary{background:var(--sun);color:var(--abyss);border-color:transparent}
.linkish{background:none;border:none;box-shadow:none;color:var(--mist);margin:10px auto 0;font-size:.85rem;padding:6px;text-decoration:underline;text-underline-offset:3px}

@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.94)}to{opacity:1;transform:none}}
@keyframes pearl{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes shimmer{to{background-position:-220% 0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{transform:scale(1.05)}}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.6)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.card,.pearl.on,h1,.orb,#rbBtn.armed,.badge.bump{animation:none}}
</style>

<div class="scene" id="scene" aria-hidden="true"><div></div><div></div></div>
<canvas id="bg" aria-hidden="true"></canvas>
<div class="app">
  <header class="top">
    <h1>Bubble Lagoon</h1>
    <div class="right">
      <div class="stats">
        <div class="stat"><span class="label">Level</span><span class="num" id="lvl">1</span></div>
        <div class="stat"><span class="label">Score</span><span class="num" id="score">0</span></div>
      </div>
      <button id="soundBtn" class="iconbtn" type="button" aria-label="Sound on"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4z"/><g id="soundWaves"><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></g></svg></button>
    </div>
  </header>
  <div class="info">
    <span id="tip">Tap 2+ matching bubbles to pop them</span>
    <span class="count"><b id="left">0</b> left · best <b id="best">–</b></span>
  </div>
  <div class="board" id="board"><canvas id="cv" aria-label="Bubble board"></canvas></div>
  <nav class="bar">
    <button id="undoBtn" type="button"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>Undo</button>
    <button id="hintBtn" type="button"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></svg>Hint</button>
    <button id="rbBtn" type="button" aria-label="Use a rainbow bubble"><span class="orb"></span>Rainbow<span class="badge" id="rbCount">0</span></button>
    <button id="bmBtn" type="button" aria-label="Use a bomb bubble"><svg class="bombicon" viewBox="0 0 24 24"><circle class="body" cx="10" cy="14" r="7"/><path d="M14.5 8.5 17 6"/><path class="spark" d="M19.5 2v2M22 4.5h-2M21.3 2.7l-1.2 1.2"/></svg>Bomb<span class="badge" id="bmCount">0</span></button>
    <button id="restartBtn" type="button"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>Restart</button>
  </nav>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="card" role="dialog" aria-labelledby="ovTitle">
    <h2 id="ovTitle">Lagoon cleared!</h2>
    <p id="ovText">Every bubble popped.</p>
    <div class="pearls" id="pearls"><span class="pearl"></span><span class="pearl"></span><span class="pearl"></span></div>
    <div class="pearl-note" id="pearlNote">Clear the board for all 3 pearls</div>
    <button id="ovRainbow" class="wide" type="button" hidden><span class="orb"></span><span id="ovRainbowLabel">Use a rainbow</span></button>
    <button id="ovBomb" class="wide" type="button" hidden><svg class="bombicon" viewBox="0 0 24 24"><circle class="body" cx="10" cy="14" r="7"/><path d="M14.5 8.5 17 6"/><path class="spark" d="M19.5 2v2M22 4.5h-2M21.3 2.7l-1.2 1.2"/></svg><span id="ovBombLabel">Use a bomb</span></button>
    <div class="actions">
      <button id="againBtn" type="button">Play again</button>
      <button id="nextBtn" class="primary" type="button">Next level</button>
    </div>
    <button id="ovUndo" class="linkish" type="button">Undo last pop</button>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const cv = $('cv'), ctx = cv.getContext('2d'), wrap = $('board');
  const bg = $('bg'), bctx = bg.getContext('2d');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const KEY = 'bubble-lagoon-v1';
  const DISPLAY = '"Baloo 2","Trebuchet MS",sans-serif';

  const PAL = [
    { base: '#ff2e63', light: '#ff7096', dark: '#c4104a' }, // coral
    { base: '#ffb300', light: '#ffd04d', dark: '#e07b00' }, // sunfish
    { base: '#14d36b', light: '#5ff09b', dark: '#079a4c' }, // sea glass
    { base: '#1e88ff', light: '#5fadff', dark: '#0b5bd1' }, // shallows
    { base: '#9a3dff', light: '#bd7dff', dark: '#6a17d6' }, // anemone
  ];
  const RAINBOW_STOPS = ['#ff2e63', '#ffb300', '#14d36b', '#1e88ff', '#9a3dff', '#ff2e63'];
  const RB = 9;       // color code for a rainbow bubble: matches every color
  const BOMB = 8;     // color code for a bomb bubble: tap to blast the 3×3 around it
  const isSpecial = b => b.color === RB || b.color === BOMB;
  const TIDAL = 12;   // pop this many at once to earn a rainbow
  const SPLASH = 8;   // pop this many at once to earn a bomb
  // Major pentatonic steps, so every pop chain sounds like a little tune.
  const SCALE = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24, 26, 28, 31, 33, 36];

  let save = { level: 1, best: {}, sound: true };
  let firstGift = false;
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && typeof s.level === 'number') save = Object.assign(save, s);
  } catch (e) {}
  if (typeof save.rainbows !== 'number') { save.rainbows = 1; firstGift = true; }
  if (typeof save.bombs !== 'number') { save.bombs = 1; firstGift = true; }
  const stashKey = kind => kind === 'bomb' ? 'bombs' : 'rainbows';
  const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(save)); } catch (e) {} };

  let level = 1, cols = 6, rows = 8, nColors = 3, grid = [], score = 0, undoStack = [];
  let busy = false, ended = false, armed = null, chain = null, nextId = 1, shake = 0;
  let parts = [], floats = [], now = 0, last = 0;
  let W = 0, H = 0, cell = 40, ox = 0, oy = 0, dpr = 1;
  let sprites = [], gloss = null, SP = 0;

  // ===== shared board logic (also run by the level-vetting script; keep it pure) =====
  // A compact board is an array of non-empty columns, each listing colors bottom-up.
  function rng(seed) {
    return () => {
      seed = seed + 0x6D2B79F5 | 0;
      let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  // Difficulty ramps gently: a new color only arrives at levels 7 and 15, and boards start
  // "clumpy" (bubbles often copy a neighbor's color) and get less clumpy level by level.
  function cfg(l) {
    const nColors = l <= 6 ? 3 : l <= 14 ? 4 : 5;
    const firstOfTier = nColors === 3 ? 1 : nColors === 4 ? 7 : 15;
    const c = l <= 4 ? 6 : l <= 10 ? 7 : 8;
    return { nColors, cols: c, rows: c + 2, clump: Math.max(0.3, 0.5 - 0.04 * (l - firstOfTier)) };
  }
  function boardFor(l, v) {
    const conf = cfg(l), R = rng(l * 7919 + 13 + v * 104729), s = [];
    for (let c = 0; c < conf.cols; c++) {
      s[c] = [];
      for (let r = 0; r < conf.rows; r++) {
        const near = [];
        if (r > 0) near.push(s[c][r - 1]);
        if (c > 0) near.push(s[c - 1][r]);
        s[c][r] = near.length && R() < conf.clump ? near[Math.floor(R() * near.length)] : Math.floor(R() * conf.nColors);
      }
    }
    return s;
  }
  // The cells a tap at (c, r) pops, following the same rules as the live game.
  function sCells(s, c, r) {
    const at = (x, y) => x >= 0 && x < s.length && y >= 0 && y < s[x].length ? s[x][y] : -1;
    const seen = new Set(), out = [];
    const take = (x, y) => { seen.add(x * 100 + y); out.push([x, y]); };
    const flood = (x0, y0, color) => {
      if (seen.has(x0 * 100 + y0)) return;
      const start = out.length;
      take(x0, y0);
      for (let i = start; i < out.length; i++) {
        const [x, y] = out[i];
        for (const [dx, dy] of DIRS) {
          const nx = x + dx, ny = y + dy, w = at(nx, ny);
          if (w < 0 || seen.has(nx * 100 + ny) || (w !== color && w !== RB)) continue;
          take(nx, ny);
        }
      }
    };
    const v = s[c][r];
    if (v === BOMB) {
      take(c, r);
      for (let i = 0; i < out.length; i++) {
        const [x, y] = out[i];
        if (s[x][y] !== BOMB) continue;
        for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++)
          if (at(x + dx, y + dy) >= 0 && !seen.has((x + dx) * 100 + y + dy)) take(x + dx, y + dy);
      }
    } else if (v === RB) {
      take(c, r);
      for (const [dx, dy] of DIRS) { const w = at(c + dx, r + dy); if (w >= 0 && w !== BOMB) flood(c + dx, r + dy, w); }
    } else flood(c, r, v);
    return out;
  }
  function sMoves(s) {
    const covered = new Set(), moves = [];
    for (let c = 0; c < s.length; c++) for (let r = 0; r < s[c].length; r++) {
      const v = s[c][r];
      if (v === RB || v === BOMB) { moves.push({ c, r, cells: sCells(s, c, r) }); continue; }
      if (covered.has(c * 100 + r)) continue;
      const cells = sCells(s, c, r);
      for (const [x, y] of cells) if (s[x][y] === v) covered.add(x * 100 + y);
      if (cells.length > 1) moves.push({ c, r, cells });
    }
    return moves;
  }
  function sApply(s, cells) {
    const gone = new Set(cells.map(([x, y]) => x * 100 + y)), out = [];
    s.forEach((col, c) => { const k = col.filter((_, r) => !gone.has(c * 100 + r)); if (k.length) out.push(k); });
    return out;
  }
  const sKey = s => s.map(col => col.join('')).join('|');
  const sCount = s => s.reduce((n, col) => n + col.length, 0);
  function playout(s, rand) {
    const path = [];
    for (;;) {
      const ms = sMoves(s);
      if (!ms.length) return { left: sCount(s), path };
      const m = ms[Math.floor(rand() * ms.length)];
      path.push(m); s = sApply(s, m.cells);
    }
  }
  // How often tapping random valid groups clears the board. Any clear also proves it's solvable.
  function clearRate(s, n, rand) {
    let clears = 0, solution = null;
    for (let i = 0; i < n; i++) {
      const p = playout(s, rand);
      if (!p.left) { clears++; solution = solution || p.path; }
    }
    return { rate: clears / n, solution };
  }
  // Depth-first search for a full clear, within a time budget.
  function solve(s, ms) {
    const t0 = performance.now(), seen = new Set();
    let timedOut = false, bestLeft = Infinity, best = null;
    function dfs(s, left, first) {
      if (left === 0) return [];
      if (performance.now() - t0 > ms) { timedOut = true; return null; }
      const k = sKey(s);
      if (seen.has(k)) return null;
      seen.add(k);
      const counts = {};
      let special = false;
      for (const col of s) for (const v of col) { if (v === RB || v === BOMB) special = true; counts[v] = (counts[v] || 0) + 1; }
      const stuck = !special && Object.values(counts).some(n => n === 1);
      const moves = stuck ? [] : sMoves(s);
      if (!moves.length) { if (left < bestLeft) { bestLeft = left; best = first; } return null; }
      moves.sort((a, b) => a.cells.length - b.cells.length);
      for (const m of moves) {
        const rest = dfs(sApply(s, m.cells), left - m.cells.length, first || m);
        if (rest) return [m, ...rest];
        if (timedOut) return null;
      }
      return null;
    }
    const path = dfs(s, sCount(s), null);
    return { path, proven: !path && !timedOut, best };
  }
  // Levels 1–100 use board variants pre-checked by tools/vet-levels.js: each one is clearable,
  // and how often random play clears it eases down from about 35% at level 1 to about 3%.
  const VARIANTS = [2,1,1,0,3,0,0,0,12,7,4,2,1,4,10,10,7,8,45,16,10,20,16,39,41,70,51,16,4,42,40,23,11,38,3,30,28,0,38,84,53,5,53,9,35,17,20,13,1,3,16,34,28,27,63,34,67,22,4,38,71,19,34,1,13,82,19,3,3,41,1,19,18,32,7,12,20,1,80,14,14,8,59,8,144,8,7,9,89,65,21,20,45,47,41,97,30,13,31,30];
  const targetRate = l => Math.max(0.03, 0.35 * Math.pow(0.88, l - 1));
  function pickVariant(l, plays, maxMs = Infinity) {
    const t0 = performance.now();
    let best = 0, bestRate = -1;
    for (let v = 0; v < 400; v++) {
      if (performance.now() - t0 > maxMs && bestRate >= 0 && bestRate < 10) return best;
      const { rate } = clearRate(boardFor(l, v), plays, rng(l * 31 + v * 7));
      if (rate >= targetRate(l) && rate <= targetRate(l) * 2) return v;
      const gap = rate >= targetRate(l) ? rate - targetRate(l) : 10 + targetRate(l) - rate;
      if (bestRate < 0 || gap < bestRate) { best = v; bestRate = gap; }
      if (v >= 40 && bestRate < 10) return best; // close enough: clearable and at least as findable as the target
    }
    return best;
  }
  // ===== end shared board logic =====
  function mk(color, c, r, fromTop) {
    return {
      id: nextId++, color, x: c,
      y: fromTop ? r + rows + 0.5 + Math.random() * 1.5 + c * 0.2 : r,
      vy: 0, scale: fromTop ? 1 : 0, phase: Math.random() * 6.28,

    ctx.beginPath(); ctx.arc(0, R * 0.06, R * 0.88, 0, Math.PI * 2); ctx.fill();
    ctx.lineWidth = R * 0.08; ctx.strokeStyle = `rgba(255,130,60,${0.45 + 0.3 * Math.sin(now * 5)})`;
    ctx.stroke();
    ctx.fillStyle = '#8a90a8';
    roundRect(ctx, -R * 0.22, -R * 0.98, R * 0.44, R * 0.22, R * 0.06); ctx.fill();
    ctx.lineWidth = R * 0.09; ctx.lineCap = 'round'; ctx.strokeStyle = '#d9c7a3';
    ctx.beginPath(); ctx.moveTo(0, -R * 0.92); ctx.quadraticCurveTo(R * 0.15, -R * 1.25, R * 0.45, -R * 1.15); ctx.stroke();
    const flick = reduced ? 1 : 0.75 + Math.random() * 0.5;
    star(R * 0.45, -R * 1.15, R * 0.3 * flick, now * 6, '#ffc23d');
    star(R * 0.45, -R * 1.15, R * 0.15 * flick, -now * 4, '#ff6a00');
    ctx.drawImage(gloss, -SP / 2 / dpr, -SP / 2 / dpr, SP / dpr, SP / dpr);
  }
  function star(x, y, s, rot, fill) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
    ctx.fillStyle = fill;
    ctx.beginPath();
    for (let i = 0; i < 8; i++) {
      const rr = i % 2 ? s * 0.28 : s, a = i * Math.PI / 4;
      ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
    }
    ctx.closePath(); ctx.fill(); ctx.restore();
  }

  function burst(b) {
    const x = px(b.x), y = py(b.y);
    const col = b.color === RB ? '#ffffff' : b.color === BOMB ? '#ffa04a' : PAL[b.color].light;
    parts.push({ kind: 'flash', x, y, r: cell * 0.6, life: 1, col });
    parts.push({ kind: 'ring', x, y, r: cell * 0.4, life: 1, col });
    const n = reduced ? 4 : 10;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2 + Math.random() * 0.5, sp = cell * (1.8 + Math.random() * 2.6);
      parts.push({ kind: 'drop', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: cell * (0.05 + Math.random() * 0.07), life: 1, col: b.color === RB ? RAINBOW_STOPS[i % 5] : col, decay: 1.2 + Math.random() });
    }
    if (!reduced && (b.color === RB || Math.random() < 0.35)) sparkleBurst(x, y, 3);
  }
  function sparkleBurst(x, y, n) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, sp = cell * (1 + Math.random() * 2.5);
      parts.push({ kind: 'spark', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: cell * (0.12 + Math.random() * 0.12), life: 1, rot: Math.random() * 6, col: RAINBOW_STOPS[i % 5], decay: 1 + Math.random() * 0.6 });
    }
  }

  function roundRect(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
  }

  function drawBubble(b, dt) {
    const R = cell * 0.46;
    let s = b.scale;
    if (!reduced) s *= 1 + Math.sin(now * 1.7 + b.phase) * 0.022;
    let sx = s, sy = s;
    if (b.squash > 0) { sx *= 1 + 0.14 * b.squash; sy *= 1 - 0.14 * b.squash; b.squash = Math.max(0, b.squash - dt * 4); }
    if (b.wob > 0) { const w = Math.sin(b.wob * 22) * 0.1 * b.wob; sx *= 1 + w; sy *= 1 - w; b.wob = Math.max(0, b.wob - dt * 2.2); }
    const hinted = b.hint > now;
    if (hinted) { const h = 1 + Math.abs(Math.sin(now * 7)) * 0.1; sx *= h; sy *= h; }
    if (b.popAt && !b.popped && chain) { const k = Math.max(0, 1 - (b.popAt - now) * 8); sx *= 1 + k * 0.18; sy *= 1 + k * 0.18; }
    ctx.save();
    ctx.translate(px(b.x), py(b.y)); ctx.scale(sx, sy);
    if (hinted) {
      ctx.fillStyle = `rgba(255,255,255,${0.25 + Math.abs(Math.sin(now * 7)) * 0.25})`;
      ctx.beginPath(); ctx.arc(0, 0, R * 1.18, 0, Math.PI * 2); ctx.fill();
    }
    if (b.color === RB) drawRainbow(R);
    else if (b.color === BOMB) drawBomb(R);
    else ctx.drawImage(sprites[b.color], -SP / 2 / dpr, -SP / 2 / dpr, SP / dpr, SP / dpr);
    ctx.restore();
  }

  function update(b, c, r, dt) {
    b.x += (c - b.x) * Math.min(1, dt * 9);
    if (Math.abs(c - b.x) < 0.002) b.x = c;
    if (b.y > r) {
      b.vy += 38 * dt;
      b.y -= b.vy * dt;
      if (b.y <= r) { b.y = r; if (b.vy > 4) b.squash = Math.min(1, b.vy / 14); b.vy = 0; }
    } else { b.y = r; b.vy = 0; }
    b.scale += (1 - b.scale) * Math.min(1, dt * 10);
  }

  // Underwater backdrop: sparkles twinkling in the water, drifting specks, rising bubbles.
  const newSparkle = s => Object.assign(s, { x: Math.random(), y: Math.random(), size: 2.5 + Math.random() * 4.5, ph: Math.random() * 6.28, sp: 0.6 + Math.random() * 1.1, rot: Math.random() * 6 });
  const sparkles = Array.from({ length: 38 }, () => newSparkle({}));
  const specks = Array.from({ length: 34 }, () => ({ x: Math.random(), y: Math.random(), r: 0.6 + Math.random() * 1.4, sp: 0.004 + Math.random() * 0.01, ph: Math.random() * 6 }));
  const amb = Array.from({ length: 20 }, () => ({ x: Math.random(), y: Math.random(), r: 2 + Math.random() * 7, sp: 0.012 + Math.random() * 0.03, ph: Math.random() * 6 }));
  function bgStar(x, y, s, rot, alpha) {
    bctx.save(); bctx.translate(x, y); bctx.rotate(rot);
    bctx.fillStyle = `rgba(225,255,250,${alpha})`;
    bctx.beginPath();
    for (let i = 0; i < 8; i++) {
      const rr = i % 2 ? s * 0.22 : s, a = i * Math.PI / 4;
      bctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
    }
    bctx.closePath(); bctx.fill(); bctx.restore();
  }
  function drawBg(dt) {
    const w = bg.width, h = bg.height;
    bctx.clearRect(0, 0, w, h);
    for (const s of sparkles) {
      let a = 0.35;
      if (!reduced) {
        const prev = Math.sin(s.ph);
        s.ph += s.sp * dt;
        const v = Math.sin(s.ph);
        if (prev < 0 && v >= 0) { newSparkle(s); s.ph = 0; } // twinkled out: fade in somewhere else
        a = Math.pow(Math.max(0, v), 3) * 0.75;
        s.y -= 0.003 * dt;
      }
      if (a < 0.02) continue;
      bgStar(s.x * w, s.y * h, s.size * dpr * (0.6 + a * 0.5), s.rot, a);
    }
    for (const s of specks) {
      if (!reduced) { s.y -= s.sp * dt; if (s.y < -0.02) { s.y = 1.02; s.x = Math.random(); } }
      bctx.fillStyle = `rgba(200,255,245,${0.18 + 0.12 * Math.sin(now * 2 + s.ph)})`;
      bctx.beginPath(); bctx.arc((s.x + Math.sin(now * 0.4 + s.ph) * 0.01) * w, s.y * h, s.r * dpr, 0, Math.PI * 2); bctx.fill();
    }
    bctx.lineWidth = 1.2 * dpr;
    for (const a of amb) {
      if (!reduced) { a.y -= a.sp * dt; if (a.y < -0.05) { a.y = 1.05; a.x = Math.random(); } }
      const x = (a.x + Math.sin(now * 0.6 + a.ph) * 0.01) * w, y = a.y * h, r = a.r * dpr;
      bctx.strokeStyle = 'rgba(234,251,246,.16)';
      bctx.beginPath(); bctx.arc(x, y, r, 0, Math.PI * 2); bctx.stroke();
      bctx.fillStyle = 'rgba(255,255,255,.22)';
      bctx.beginPath(); bctx.arc(x - r * 0.35, y - r * 0.35, r * 0.25, 0, Math.PI * 2); bctx.fill();
    }
  }

  function frame(t) {
    const dt = Math.min(0.05, (t - last) / 1000 || 0);
    last = t; now += dt;
    runChain();
    drawBg(dt);
    let sx = 0, sy = 0;
    if (shake > 0.2) { sx = (Math.random() - 0.5) * shake * 2; sy = (Math.random() - 0.5) * shake * 2; shake *= Math.exp(-dt * 7); } else shake = 0;
    ctx.setTransform(dpr, 0, 0, dpr, sx * dpr, sy * dpr);
    ctx.clearRect(-20, -20, W + 40, H + 40);

    // glass panel behind the bubbles
    const pg = ctx.createLinearGradient(0, oy, 0, oy + cell * rows);
    pg.addColorStop(0, 'rgba(4,18,28,.32)'); pg.addColorStop(1, 'rgba(4,18,28,.5)');
    ctx.fillStyle = pg;
    roundRect(ctx, ox - 6, oy - 6, cell * cols + 12, cell * rows + 12, cell * 0.5);
    ctx.fill();
    ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(255,255,255,.1)'; ctx.stroke();

    for (let c = 0; c < cols; c++) for (let r = 0; r < rows; r++) {
      const b = grid[c][r];
      if (!b || b.popped) continue;
      update(b, c, r, dt);
      drawBubble(b, dt);
    }

    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      if (p.kind === 'flash') {
        ctx.globalCompositeOperation = 'lighter';
        p.life -= dt * 5;
        const a = Math.max(0, p.life);
        const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
        g.addColorStop(0, rgba(p.col, 0.35 * a)); g.addColorStop(1, rgba(p.col, 0));
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
        ctx.globalCompositeOperation = 'source-over';
      } else if (p.kind === 'ring') {
        p.life -= dt * 2.8; p.r += cell * 1.8 * dt;
        ctx.globalAlpha = Math.max(0, p.life) * 0.9;
        ctx.strokeStyle = p.col; ctx.lineWidth = cell * 0.06 * Math.max(0.2, p.life);
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.stroke();
      } else {
        p.life -= dt * p.decay;
        p.vx *= 1 - dt * 3; p.vy = p.vy * (1 - dt * 3) - cell * 2.2 * dt; // little bubbles float upward
        p.x += p.vx * dt; p.y += p.vy * dt;
        ctx.globalAlpha = Math.max(0, p.life);
        if (p.kind === 'spark') { p.rot += dt * 4; star(p.x, p.y, p.r * (0.5 + p.life * 0.5), p.rot, p.col); }
        else {
          ctx.fillStyle = p.col;
          ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
        }
      }
      if (p.life <= 0) parts.splice(i, 1);
    }
    ctx.globalCompositeOperation = 'source-over';

    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (let i = floats.length - 1; i >= 0; i--) {
      const f = floats[i];
      f.life -= dt * 0.9; f.y -= cell * 0.9 * dt;
      ctx.globalAlpha = Math.max(0, Math.min(1, f.life * 1.6));
      const size = Math.round(cell * 0.5 * f.size);
      ctx.font = `800 ${size}px ${DISPLAY}`;
      ctx.lineWidth = cell * 0.1; ctx.strokeStyle = 'rgba(4,20,30,.65)';
      ctx.strokeText(f.text, f.x, f.y);
      if (f.rainbow) {
        const wd = ctx.measureText(f.text).width;
        const g = ctx.createLinearGradient(f.x - wd / 2, 0, f.x + wd / 2, 0);
        RAINBOW_STOPS.forEach((col, k) => g.addColorStop(k / (RAINBOW_STOPS.length - 1), col));
        ctx.fillStyle = g;
      } else ctx.fillStyle = '#fff6da';
      ctx.fillText(f.text, f.x, f.y);
      if (f.life <= 0) floats.splice(i, 1);
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(frame);
  }

  // ---------- input ----------
  cv.addEventListener('pointerdown', e => {
    e.preventDefault();
    ac();
    const r = cv.getBoundingClientRect();
    const c = Math.floor((e.clientX - r.left - ox) / cell);
    const row = rows - 1 - Math.floor((e.clientY - r.top - oy) / cell);
    if (c >= 0 && c < cols && row >= 0 && row < rows) tap(c, row);
  });
  $('undoBtn').onclick = undo;
  $('ovUndo').onclick = undo;
  $('hintBtn').onclick = hint;
  $('rbBtn').onclick = () => setArmed(armed === 'rainbow' ? null : 'rainbow');
  $('bmBtn').onclick = () => setArmed(armed === 'bomb' ? null : 'bomb');
  $('ovRainbow').onclick = () => { $('overlay').hidden = true; ended = false; setArmed('rainbow'); };
  $('ovBomb').onclick = () => { $('overlay').hidden = true; ended = false; setArmed('bomb'); };
  $('restartBtn').onclick = () => { if (!busy) startLevel(level); };
  $('againBtn').onclick = () => startLevel(level);
  $('nextBtn').onclick = () => startLevel(level + 1);
  $('soundBtn').onclick = () => { save.sound = !save.sound; persist(); hud(); if (save.sound) note(7); };
  addEventListener('resize', layout);
  if (window.ResizeObserver) new ResizeObserver(layout).observe(wrap);

  // Keep the board as-is when the page is updated while open.
  window.claude?.hot?.snapshot?.(() => ({ level, score, g: colorsOf(), undoStack }));
  const boot = d => {
    if (d && d.g) {
      ({ nColors, cols, rows } = cfg(d.level));
      level = d.level; score = d.score; undoStack = d.undoStack || [];
      grid = fromColors(d.g);
      showWorld(level);
      layout(); hud();
    } else startLevel(save.level || 1);
    persist();
    if (firstGift) tip('A gift for your stash! Pop 8+ at once to earn bombs, 12+ to earn rainbows.');
    requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });
  };
  window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
})();
</script>
