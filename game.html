<title>Bubble Lagoon</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: one-screen phone app — name + stats strip, a glass board that fills the remaining height, a thumb-reach control bar with the rainbow stash in the middle. One deliberate deep-lagoon look (single theme). */
:root{
  --abyss:#05141f;
  --deep:#0a2f42;
  --lagoon:#11586a;
  --shallow:#1d8a92;
  --foam:#eafbf6;
  --mist:rgba(234,251,246,.66);
  --sun:#ffd166;
  --glass:rgba(255,255,255,.06);
  --line:rgba(255,255,255,.13);
  --rainbow:conic-gradient(from 0deg,#ff5e8a,#ffc94a,#3ff0b4,#48b8ff,#b47cff,#ff5e8a);
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{
  background:var(--abyss);
  background-image:radial-gradient(140% 80% at 50% -10%,var(--shallow) 0%,var(--lagoon) 30%,var(--deep) 62%,var(--abyss) 100%);
  color:var(--foam);font-family:var(--body);
  overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
}
#bg{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.app{
  position:relative;height:100%;box-sizing:border-box;
  display:flex;flex-direction:column;gap:10px;
  max-width:560px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:12px;
}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{
  font-family:var(--display);font-weight:800;font-size:clamp(1.6rem,7vw,2.2rem);line-height:1;margin:0;letter-spacing:-.01em;
  background:linear-gradient(100deg,#eafbf6 0%,#9ff3ff 30%,#ffd166 55%,#ff9ec0 75%,#eafbf6 100%);
  background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 10px rgba(120,240,255,.25));
  animation:shimmer 9s linear infinite;
}
.stats{display:flex;gap:18px}
.stat{display:flex;flex-direction:column;align-items:flex-end}
.label{font-size:.66rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--mist)}
.num{font-family:var(--display);font-weight:800;font-size:1.4rem;line-height:1.1;font-variant-numeric:tabular-nums}
.info{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:.86rem;color:var(--mist);min-height:1.3em}
#tip{min-width:0;transition:color .3s}
#tip.flash{color:var(--sun)}
.info .count{white-space:nowrap}
.info b{color:var(--foam)}
.board{flex:1;min-height:0;position:relative}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
.bar{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
button{
  position:relative;
  font:800 .78rem var(--body);color:var(--foam);
  background:var(--glass);border:1px solid var(--line);border-radius:16px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 6px 16px rgba(0,0,0,.25);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  padding:10px 2px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;
  transition:transform .12s ease,opacity .2s,box-shadow .3s;
}
button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
button:active{transform:scale(.94)}
button:disabled{opacity:.38}
button:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
.orb{width:22px;height:22px;border-radius:50%;background:var(--rainbow);box-shadow:0 0 12px rgba(255,255,255,.45),inset -3px -4px 6px rgba(0,0,0,.25),inset 3px 3px 5px rgba(255,255,255,.6);animation:spin 5s linear infinite}
#rbBtn{border-color:rgba(255,220,250,.35)}
#rbBtn:disabled .orb{filter:grayscale(1);animation:none}
#rbBtn.armed{box-shadow:0 0 0 2px #fff,0 0 26px rgba(255,200,255,.75);animation:pulse 1s ease-in-out infinite}
.badge{position:absolute;top:-7px;right:-3px;min-width:20px;height:20px;box-sizing:border-box;border-radius:10px;padding:0 6px;background:var(--sun);color:var(--abyss);font:800 .74rem/20px var(--body);font-variant-numeric:tabular-nums}
.badge.bump{animation:bump .5s cubic-bezier(.2,1.8,.4,1)}
.fly{position:fixed;left:0;top:0;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;background:var(--rainbow);box-shadow:0 0 30px rgba(255,255,255,.8);pointer-events:none;z-index:5;transition:transform .85s cubic-bezier(.45,-0.35,.35,1),opacity .85s ease-in}

.overlay{
  position:fixed;inset:0;display:grid;place-items:center;z-index:4;
  background:rgba(3,14,22,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
}
.card{
  width:100%;max-width:340px;box-sizing:border-box;text-align:center;
  background:linear-gradient(180deg,rgba(29,138,146,.55),rgba(10,47,66,.92) 55%,rgba(5,20,31,.96));
  border:1px solid var(--line);border-radius:28px;padding:28px 22px 20px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 24px 60px rgba(0,0,0,.5);
  animation:rise .45s cubic-bezier(.2,1.3,.4,1) both;
}
.card h2{font-family:var(--display);font-weight:800;font-size:2rem;line-height:1.05;margin:0;text-wrap:balance}
.card p{margin:8px 0 0;color:var(--mist);line-height:1.45}
.pearls{display:flex;gap:16px;justify-content:center;margin:20px 0 6px}
.pearl{width:38px;height:38px;border-radius:50%;background:rgba(234,251,246,.08);box-shadow:inset 0 0 0 2px rgba(234,251,246,.18)}
.pearl.on{
  background:radial-gradient(circle at 34% 30%,#fff 0 10%,#f7f0e8 28%,#ddcfc0 72%,#b8a594 100%);
  box-shadow:0 0 22px rgba(255,238,215,.55);
  animation:pearl .55s cubic-bezier(.2,1.6,.4,1) both;
}
.pearl.on:nth-child(2){animation-delay:.15s}
.pearl.on:nth-child(3){animation-delay:.3s}
.pearl-note{font-size:.8rem;color:var(--mist)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.actions button,.wide{flex-direction:row;justify-content:center;font-size:.95rem;padding:13px 8px}
.wide{width:100%;margin-top:10px;gap:8px}
.actions .primary{background:var(--sun);color:var(--abyss);border-color:transparent}
.linkish{background:none;border:none;box-shadow:none;color:var(--mist);margin:10px auto 0;font-size:.85rem;padding:6px;text-decoration:underline;text-underline-offset:3px}

@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.94)}to{opacity:1;transform:none}}
@keyframes pearl{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes shimmer{to{background-position:-220% 0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{transform:scale(1.05)}}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.6)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.card,.pearl.on,h1,.orb,#rbBtn.armed,.badge.bump{animation:none}}
</style>

<canvas id="bg" aria-hidden="true"></canvas>
<div class="app">
  <header class="top">
    <h1>Bubble Lagoon</h1>
    <div class="stats">
      <div class="stat"><span class="label">Level</span><span class="num" id="lvl">1</span></div>
      <div class="stat"><span class="label">Score</span><span class="num" id="score">0</span></div>
    </div>
  </header>
  <div class="info">
    <span id="tip">Tap 2+ matching bubbles to pop them</span>
    <span class="count"><b id="left">0</b> left · best <b id="best">–</b></span>
  </div>
  <div class="board" id="board"><canvas id="cv" aria-label="Bubble board"></canvas></div>
  <nav class="bar">
    <button id="undoBtn" type="button"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>Undo</button>
    <button id="hintBtn" type="button"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></svg>Hint</button>
    <button id="rbBtn" type="button" aria-label="Use a rainbow bubble"><span class="orb"></span>Rainbow<span class="badge" id="rbCount">0</span></button>
    <button id="restartBtn" type="button"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>Restart</button>
    <button id="soundBtn" type="button"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4z"/><g id="soundWaves"><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></g></svg><span id="soundLabel">Sound</span></button>
  </nav>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="card" role="dialog" aria-labelledby="ovTitle">
    <h2 id="ovTitle">Lagoon cleared!</h2>
    <p id="ovText">Every bubble popped.</p>
    <div class="pearls" id="pearls"><span class="pearl"></span><span class="pearl"></span><span class="pearl"></span></div>
    <div class="pearl-note" id="pearlNote">Clear the board for all 3 pearls</div>
    <button id="ovRainbow" class="wide" type="button" hidden><span class="orb"></span><span id="ovRainbowLabel">Use a rainbow</span></button>
    <div class="actions">
      <button id="againBtn" type="button">Play again</button>
      <button id="nextBtn" class="primary" type="button">Next level</button>
    </div>
    <button id="ovUndo" class="linkish" type="button">Undo last pop</button>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const cv = $('cv'), ctx = cv.getContext('2d'), wrap = $('board');
  const bg = $('bg'), bctx = bg.getContext('2d');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const KEY = 'bubble-lagoon-v1';
  const DISPLAY = '"Baloo 2","Trebuchet MS",sans-serif';

  const PAL = [
    { base: '#ff5e8a', light: '#ffd3e0', dark: '#b8204e' }, // coral
    { base: '#ffc94a', light: '#fff4c4', dark: '#c98a0c' }, // sunfish
    { base: '#3ff0b4', light: '#d0fff0', dark: '#0f9c74' }, // sea glass
    { base: '#48b8ff', light: '#d4edff', dark: '#1767bd' }, // shallows
    { base: '#b47cff', light: '#ecdcff', dark: '#6e36c4' }, // anemone
  ];
  const RAINBOW_STOPS = ['#ff5e8a', '#ffc94a', '#3ff0b4', '#48b8ff', '#b47cff', '#ff5e8a'];
  const RB = 9;       // color code for a rainbow bubble: matches every color
  const TIDAL = 12;   // pop this many at once to earn a rainbow
  // Major pentatonic steps, so every pop chain sounds like a little tune.
  const SCALE = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24, 26, 28, 31, 33, 36];

  let save = { level: 1, best: {}, sound: true };
  let firstGift = false;
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && typeof s.level === 'number') save = Object.assign(save, s);
  } catch (e) {}
  if (typeof save.rainbows !== 'number') { save.rainbows = 1; firstGift = true; }
  const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(save)); } catch (e) {} };

  let level = 1, cols = 6, rows = 8, nColors = 3, grid = [], score = 0, undoStack = [];
  let busy = false, ended = false, armed = false, chain = null, nextId = 1, shake = 0;
  let parts = [], floats = [], now = 0, last = 0;
  let W = 0, H = 0, cell = 40, ox = 0, oy = 0, dpr = 1;
  let sprites = [], gloss = null, SP = 0;

  function rng(seed) {
    return () => {
      seed = seed + 0x6D2B79F5 | 0;
      let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function cfg(l) {
    const c = l <= 3 ? 6 : l <= 8 ? 7 : 8;
    return { nColors: l <= 2 ? 3 : l <= 5 ? 4 : 5, cols: c, rows: c + 2 };
  }
  function mk(color, c, r, fromTop) {
    return {
      id: nextId++, color, x: c,
      y: fromTop ? r + rows + 0.5 + Math.random() * 1.5 + c * 0.2 : r,
      vy: 0, scale: fromTop ? 1 : 0, phase: Math.random() * 6.28,
      squash: 0, wob: 0, hint: 0, popAt: 0, popIdx: 0, popped: false,
    };
  }
  const colorsOf = () => grid.map(col => col.map(b => b ? b.color : null));
  const fromColors = g => g.map((col, c) => col.map((k, r) => k === null ? null : mk(k, c, r, false)));

  function startLevel(l) {
    level = l;
    ({ nColors, cols, rows } = cfg(l));
    const R = rng(l * 7919 + 13);
    grid = [];
    for (let c = 0; c < cols; c++) {
      grid[c] = [];
      for (let r = 0; r < rows; r++) grid[c][r] = mk(Math.floor(R() * nColors), c, r, true);
    }
    score = 0; undoStack = []; ended = false; busy = false; armed = false; chain = null; parts = []; floats = [];
    save.level = l; persist();
    $('overlay').hidden = true;
    layout(); hud();
  }

  // ---------- puzzle logic ----------
  const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  const inside = (x, y) => x >= 0 && y >= 0 && x < cols && y < rows;
  // Breadth-first from the seed, so pops ripple outward from the tap.
  // Rainbows join any color's group.
  function flood(c, r, color, seen, out) {
    const start = out.length;
    if (seen.has(c * 100 + r)) return;
    seen.add(c * 100 + r); out.push([c, r]);
    for (let i = start; i < out.length; i++) {
      const [x, y] = out[i];
      for (const [dx, dy] of DIRS) {
        const nx = x + dx, ny = y + dy;
        if (!inside(nx, ny) || seen.has(nx * 100 + ny)) continue;
        const b = grid[nx][ny];
        if (!b || (b.color !== color && b.color !== RB)) continue;
        seen.add(nx * 100 + ny); out.push([nx, ny]);
      }
    }
  }
  function findGroup(c, r) {
    const seen = new Set(), out = [], b = grid[c][r];
    if (b.color !== RB) { flood(c, r, b.color, seen, out); return out; }
    // Tapping a rainbow pops it together with every group touching it.
    seen.add(c * 100 + r); out.push([c, r]);
    for (const [dx, dy] of DIRS) {
      const nx = c + dx, ny = r + dy;
      if (inside(nx, ny) && grid[nx][ny]) flood(nx, ny, grid[nx][ny].color, seen, out);
    }
    return out;
  }
  function hasMoves() {
    const match = (a, b) => b && (a.color === b.color || b.color === RB);
    for (let c = 0; c < cols; c++) for (let r = 0; r < rows; r++) {
      const b = grid[c][r]; if (!b) continue;
      if (b.color === RB) return true;
      if (c + 1 < cols && match(b, grid[c + 1][r])) return true;
      if (r + 1 < rows && match(b, grid[c][r + 1])) return true;
    }
    return false;
  }
  const remaining = () => grid.reduce((n, col) => n + col.filter(Boolean).length, 0);
  function collapse() {
    for (let c = 0; c < cols; c++) {
      const col = grid[c].filter(Boolean);
      while (col.length < rows) col.push(null);
      grid[c] = col;
    }
    // Empty columns drift out to both sides so what's left gathers in the middle.
    const filled = grid.filter(col => col[0]);
    const empty = cols - filled.length, leftPad = Math.floor(empty / 2);
    const blank = () => Array(rows).fill(null);
    grid = [...Array.from({ length: leftPad }, blank), ...filled, ...Array.from({ length: empty - leftPad }, blank)];
  }
  const pushUndo = () => {
    undoStack.push({ g: colorsOf(), score, rainbows: save.rainbows });
    if (undoStack.length > 80) undoStack.shift();
  };

  function tap(c, r) {
    if (busy || ended) return;
    const b = grid[c] && grid[c][r];
    if (!b) return;
    if (armed) { placeRainbow(b); return; }
    const g = findGroup(c, r);
    if (g.length < 2 && b.color !== RB) { b.wob = 1; boop(); return; }
    pushUndo();
    busy = true;
    const step = Math.min(0.05, 0.7 / g.length);
    g.forEach(([x, y], i) => { const t = grid[x][y]; t.popAt = now + i * step; t.popIdx = i; });
    const gain = g.length * (g.length - 1) * 5 + (b.color === RB ? 50 : 0);
    score += gain;
    const fx = px(b.x), fy = py(b.y);
    floats.push({ x: fx, y: fy, text: '+' + gain, life: 1, size: 1 });
    if (g.length >= TIDAL) {
      floats.push({ x: fx, y: fy - cell, text: 'Tidal wave!', life: 1.4, size: 1.5, rainbow: true });
      save.rainbows++; persist();
      setTimeout(() => flyToStash(fx, fy), 350);
      tip('Tidal wave! You earned a rainbow bubble.');
    } else if (g.length >= 8) {
      floats.push({ x: fx, y: fy - cell, text: 'Splash!', life: 1.2, size: 1.3 });
    }
    if (g.length >= 8 && !reduced) shake = Math.min(cell * 0.2, (g.length - 6) * 1.1);
    chain = { cells: g, end: now + g.length * step + 0.08 };
    buzz(g.length >= 8 ? 20 : 8); hud();
  }

  function placeRainbow(b) {
    if (b.color === RB) return;
    pushUndo();
    b.color = RB; b.wob = 1; b.scale = 0.4;
    armed = false;
    save.rainbows--; persist();
    sparkleBurst(px(b.x), py(b.y), 14);
    shimmer(); buzz(15);
    tip('Rainbow placed! It matches every color. Tap it to pop it with all its neighbors.');
    hud();
  }

  function setArmed(on) {
    if (on && (save.rainbows < 1 || busy || ended)) return;
    armed = on;
    tip(on ? 'Tap any bubble to turn it into a rainbow.' : null);
    if (on) note(12, 0, 0.2, 'triangle', 0.07, 1);
    hud();
  }

  function runChain() {
    if (!chain) return;
    let all = true;
    for (const [x, y] of chain.cells) {
      const b = grid[x][y];
      if (!b || b.popped) continue;
      if (b.popAt <= now) { b.popped = true; burst(b); popNote(b.popIdx); }
      else all = false;
    }
    if (all && now >= chain.end) {
      for (const [x, y] of chain.cells) grid[x][y] = null;
      chain = null;
      collapse();
      busy = false;
      if (!hasMoves()) {
        ended = true;
        const left = remaining();
        if (left === 0) { score += 1000; floats.push({ x: W / 2, y: H / 2, text: '+1000', life: 1.4, size: 1.6, rainbow: true }); }
        hud();
        setTimeout(() => showEnd(left), left === 0 ? 1100 : 750);
        if (left === 0) setTimeout(chime, 250);
      } else hud();
    }
  }

  function undo() {
    if (busy || !undoStack.length) return;
    const s = undoStack.pop();
    grid = fromColors(s.g); score = s.score; ended = false; armed = false;
    if (typeof s.rainbows === 'number') { save.rainbows = s.rainbows; persist(); }
    $('overlay').hidden = true;
    swish(); tip(null); hud();
  }
  function hint() {
    if (busy || ended) return;
    let best = null;
    for (let c = 0; c < cols; c++) for (let r = 0; r < rows; r++) {
      if (!grid[c][r] || grid[c][r].color === RB) continue;
      const g = findGroup(c, r);
      if (g.length > 1 && (!best || g.length > best.length)) best = g;
    }
    if (best) for (const [x, y] of best) grid[x][y].hint = now + 1.6;
  }

  function showEnd(left) {
    const pearls = left === 0 ? 3 : left <= 3 ? 2 : left <= 8 ? 1 : 0;
    const prev = save.best[level] || { pearls: 0, score: 0 };
    save.best[level] = { pearls: Math.max(prev.pearls, pearls), score: Math.max(prev.score, score) };
    persist(); hud();
    $('ovTitle').textContent = left === 0 ? 'Lagoon cleared!' : pearls ? 'Nicely popped' : 'No more matches';
    $('ovText').textContent = left === 0
      ? 'Every bubble popped. +1,000 bonus.'
      : `${left} bubble${left === 1 ? '' : 's'} left drifting. Score ${score.toLocaleString()}.`;
    [...$('pearls').children].forEach((p, i) => p.classList.toggle('on', i < pearls));
    $('pearlNote').textContent = pearls === 3 ? 'All 3 pearls' : left <= 3 ? 'Clear every bubble for 3 pearls' : 'Leave 3 or fewer for 2 pearls · clear all for 3';
    const canRainbow = left > 0 && save.rainbows > 0;
    $('ovRainbow').hidden = !canRainbow;
    $('ovRainbowLabel').textContent = `Keep going with a rainbow (${save.rainbows})`;
    $('overlay').hidden = false;
    (canRainbow ? $('ovRainbow') : $('nextBtn')).focus({ preventScroll: true });
  }

  let tipTimer = 0;
  function tip(msg) {
    clearTimeout(tipTimer);
    const el = $('tip');
    if (!msg) { el.textContent = 'Tap 2+ matching bubbles to pop them'; el.classList.remove('flash'); return; }
    el.textContent = msg; el.classList.add('flash');
    if (!armed) tipTimer = setTimeout(() => tip(null), 4200);
  }

  function hud() {
    $('lvl').textContent = level;
    $('score').textContent = score.toLocaleString();
    $('left').textContent = remaining();
    const b = save.best[level];
    $('best').textContent = b ? b.score.toLocaleString() : '–';
    $('undoBtn').disabled = !undoStack.length;
    $('rbCount').textContent = save.rainbows;
    $('rbBtn').disabled = save.rainbows < 1 && !armed;
    $('rbBtn').classList.toggle('armed', armed);
    $('soundWaves').innerHTML = save.sound
      ? '<path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/>'
      : '<path d="m22 9-6 6M16 9l6 6"/>';
    $('soundLabel').textContent = save.sound ? 'Sound' : 'Muted';
  }

  function flyToStash(x, y) {
    const r = cv.getBoundingClientRect(), t = $('rbBtn').getBoundingClientRect();
    const sx = r.left + x, sy = r.top + y;
    const el = document.createElement('div');
    el.className = 'fly';
    el.style.transform = `translate(${sx}px,${sy}px) scale(.3)`;
    document.body.appendChild(el);
    shimmer();
    requestAnimationFrame(() => requestAnimationFrame(() => {
      el.style.transform = `translate(${t.left + t.width / 2}px,${t.top + t.height / 2 - 6}px) scale(.55)`;
      el.style.opacity = '.4';
    }));
    setTimeout(() => {
      el.remove();
      const badge = $('rbCount');
      badge.classList.remove('bump'); void badge.offsetWidth; badge.classList.add('bump');
      note(19, 0, 0.3, 'triangle', 0.08, 1);
    }, 880);
  }

  // ---------- sound ----------
  let actx = null;
  function ac() {
    if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
    if (actx.state === 'suspended') actx.resume();
    return actx;
  }
  function note(semi, delay = 0, dur = 0.22, type = 'sine', vol = 0.14, bend = 1.5) {
    if (!save.sound) return;
    const a = ac(); if (!a) return;
    const t = a.currentTime + delay, f = 392 * Math.pow(2, semi / 12);
    const o = a.createOscillator(), g = a.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f * bend, t);
    o.frequency.exponentialRampToValueAtTime(f, t + 0.035);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(a.destination);
    o.start(t); o.stop(t + dur + 0.03);
  }
  const popNote = i => note(SCALE[Math.min(i, SCALE.length - 1)], 0, 0.24, 'sine', 0.13, 1.8);
  const boop = () => note(-5, 0, 0.16, 'triangle', 0.07, 0.8);
  const swish = () => { note(7, 0, 0.12, 'sine', 0.06, 0.7); note(0, 0.06, 0.14, 'sine', 0.06, 0.7); };
  const shimmer = () => [12, 16, 19, 24, 28, 31].forEach((s, i) => note(s, i * 0.04, 0.35, 'triangle', 0.05, 1));
  const chime = () => [0, 4, 7, 12, 16, 19, 24].forEach((s, i) => note(s + 5, i * 0.08, 0.5, 'sine', 0.09, 1));
  const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

  // ---------- drawing ----------
  const px = x => ox + (x + 0.5) * cell;
  const py = y => oy + (rows - 1 - y + 0.5) * cell;
  const rgba = (hex, a) => {
    const n = parseInt(hex.slice(1), 16);
    return `rgba(${n >> 16},${n >> 8 & 255},${n & 255},${a})`;
  };

  function layout() {
    const r = wrap.getBoundingClientRect();
    dpr = Math.min(2, window.devicePixelRatio || 1);
    W = r.width; H = r.height;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    cell = Math.min(W / cols, H / rows);
    ox = (W - cell * cols) / 2; oy = (H - cell * rows) / 2;
    bg.width = Math.round(innerWidth * dpr); bg.height = Math.round(innerHeight * dpr);
    buildSprites();
  }

  // Bubbles are painted once per size into sprites (glow, glassy body, highlights), then stamped each frame.
  function buildSprites() {
    const R = cell * 0.46 * dpr;
    SP = Math.max(4, Math.ceil(R * 2 * 1.5));
    const C = SP / 2;
    const canvas = () => { const c = document.createElement('canvas'); c.width = c.height = SP; return c; };
    sprites = PAL.map(p => {
      const c = canvas(), g = c.getContext('2d');
      let gr = g.createRadialGradient(C, C, R * 0.75, C, C, R * 1.45);
      gr.addColorStop(0, rgba(p.base, 0.42)); gr.addColorStop(1, rgba(p.base, 0));
      g.fillStyle = gr; g.fillRect(0, 0, SP, SP);
      gr = g.createRadialGradient(C - R * 0.3, C - R * 0.38, R * 0.05, C, C, R);
      gr.addColorStop(0, p.light); gr.addColorStop(0.5, p.base); gr.addColorStop(1, p.dark);
      g.fillStyle = gr;
      g.beginPath(); g.arc(C, C, R, 0, Math.PI * 2); g.fill();
      g.drawImage(paintGloss(canvas(), C, R), 0, 0);
      return c;
    });
    gloss = paintGloss(canvas(), C, R);
  }
  function paintGloss(c, C, R) {
    const g = c.getContext('2d');
    g.save();
    g.beginPath(); g.arc(C, C, R, 0, Math.PI * 2); g.clip();
    let gr = g.createRadialGradient(C, C, R * 0.6, C, C, R);
    gr.addColorStop(0, 'rgba(0,10,30,0)'); gr.addColorStop(1, 'rgba(0,10,30,.32)');
    g.fillStyle = gr; g.fillRect(0, 0, SP, SP);
    // light bending through the bottom of the bubble
    gr = g.createRadialGradient(C + R * 0.1, C + R * 0.75, 0, C + R * 0.1, C + R * 0.75, R * 0.65);
    gr.addColorStop(0, 'rgba(255,255,255,.45)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr; g.fillRect(0, 0, SP, SP);
    g.restore();
    g.save();
    g.translate(C - R * 0.3, C - R * 0.42); g.rotate(-0.55); g.scale(1, 0.58);
    gr = g.createRadialGradient(0, 0, 0, 0, 0, R * 0.46);
    gr.addColorStop(0, 'rgba(255,255,255,.95)'); gr.addColorStop(0.55, 'rgba(255,255,255,.55)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr;
    g.beginPath(); g.arc(0, 0, R * 0.46, 0, Math.PI * 2); g.fill();
    g.restore();
    g.fillStyle = 'rgba(255,255,255,.9)';
    g.beginPath(); g.arc(C + R * 0.42, C - R * 0.5, R * 0.07, 0, Math.PI * 2); g.fill();
    g.lineWidth = R * 0.05; g.strokeStyle = 'rgba(255,255,255,.3)';
    g.beginPath(); g.arc(C, C, R * 0.97, 0, Math.PI * 2); g.stroke();
    return c;
  }
  function rainbowGradient(c, x, y, R, spin) {
    let g;
    if (c.createConicGradient) g = c.createConicGradient(spin, x, y);
    else g = c.createLinearGradient(x - R, y - R, x + R, y + R);
    RAINBOW_STOPS.forEach((col, i) => g.addColorStop(i / (RAINBOW_STOPS.length - 1), col));
    return g;
  }
  function drawRainbow(R) {
    const pulse = 0.5 + 0.5 * Math.sin(now * 3);
    let gr = ctx.createRadialGradient(0, 0, R * 0.7, 0, 0, R * (1.5 + pulse * 0.2));
    gr.addColorStop(0, `rgba(255,240,255,${0.45 + pulse * 0.2})`); gr.addColorStop(1, 'rgba(255,240,255,0)');
    ctx.fillStyle = gr;
    ctx.beginPath(); ctx.arc(0, 0, R * 1.7, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = rainbowGradient(ctx, 0, 0, R, reduced ? 0 : now * 1.4);
    ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.fill();
    gr = ctx.createRadialGradient(0, 0, 0, 0, 0, R);
    gr.addColorStop(0, 'rgba(255,255,255,.55)'); gr.addColorStop(0.6, 'rgba(255,255,255,.1)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = gr;
    ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.fill();
    ctx.drawImage(gloss, -SP / 2 / dpr, -SP / 2 / dpr, SP / dpr, SP / dpr);
    if (!reduced) {
      const a = now * 2.2;
      star(Math.cos(a) * R * 1.15, Math.sin(a) * R * 1.15, R * 0.22, a, 'rgba(255,255,255,.9)');
    }
  }
  function star(x, y, s, rot, fill) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
    ctx.fillStyle = fill;
    ctx.beginPath();
    for (let i = 0; i < 8; i++) {
      const rr = i % 2 ? s * 0.28 : s, a = i * Math.PI / 4;
      ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
    }
    ctx.closePath(); ctx.fill(); ctx.restore();
  }

  function burst(b) {
    const x = px(b.x), y = py(b.y);
    const col = b.color === RB ? '#ffffff' : PAL[b.color].light;
    parts.push({ kind: 'flash', x, y, r: cell * 0.6, life: 1, col });
    parts.push({ kind: 'ring', x, y, r: cell * 0.4, life: 1, col });
    const n = reduced ? 4 : 10;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2 + Math.random() * 0.5, sp = cell * (1.8 + Math.random() * 2.6);
      parts.push({ kind: 'drop', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: cell * (0.05 + Math.random() * 0.07), life: 1, col: b.color === RB ? RAINBOW_STOPS[i % 5] : col, decay: 1.2 + Math.random() });
    }
    if (!reduced && (b.color === RB || Math.random() < 0.35)) sparkleBurst(x, y, 3);
  }
  function sparkleBurst(x, y, n) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, sp = cell * (1 + Math.random() * 2.5);
      parts.push({ kind: 'spark', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: cell * (0.12 + Math.random() * 0.12), life: 1, rot: Math.random() * 6, col: RAINBOW_STOPS[i % 5], decay: 1 + Math.random() * 0.6 });
    }
  }

  function roundRect(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
  }

  function drawBubble(b, dt) {
    const R = cell * 0.46;
    let s = b.scale;
    if (!reduced) s *= 1 + Math.sin(now * 1.7 + b.phase) * 0.022;
    let sx = s, sy = s;
    if (b.squash > 0) { sx *= 1 + 0.14 * b.squash; sy *= 1 - 0.14 * b.squash; b.squash = Math.max(0, b.squash - dt * 4); }
    if (b.wob > 0) { const w = Math.sin(b.wob * 22) * 0.1 * b.wob; sx *= 1 + w; sy *= 1 - w; b.wob = Math.max(0, b.wob - dt * 2.2); }
    const hinted = b.hint > now;
    if (hinted) { const h = 1 + Math.abs(Math.sin(now * 7)) * 0.1; sx *= h; sy *= h; }
    if (b.popAt && !b.popped && chain) { const k = Math.max(0, 1 - (b.popAt - now) * 8); sx *= 1 + k * 0.18; sy *= 1 + k * 0.18; }
    ctx.save();
    ctx.translate(px(b.x), py(b.y)); ctx.scale(sx, sy);
    if (hinted) {
      ctx.fillStyle = `rgba(255,255,255,${0.25 + Math.abs(Math.sin(now * 7)) * 0.25})`;
      ctx.beginPath(); ctx.arc(0, 0, R * 1.18, 0, Math.PI * 2); ctx.fill();
    }
    if (b.color === RB) drawRainbow(R);
    else ctx.drawImage(sprites[b.color], -SP / 2 / dpr, -SP / 2 / dpr, SP / dpr, SP / dpr);
    ctx.restore();
  }

  function update(b, c, r, dt) {
    b.x += (c - b.x) * Math.min(1, dt * 9);
    if (Math.abs(c - b.x) < 0.002) b.x = c;
    if (b.y > r) {
      b.vy += 38 * dt;
      b.y -= b.vy * dt;
      if (b.y <= r) { b.y = r; if (b.vy > 4) b.squash = Math.min(1, b.vy / 14); b.vy = 0; }
    } else { b.y = r; b.vy = 0; }
    b.scale += (1 - b.scale) * Math.min(1, dt * 10);
  }

  // Underwater backdrop: swaying light shafts, drifting specks, rising bubbles.
  const rays = Array.from({ length: 6 }, (_, i) => ({ x: (i + 0.5) / 6 + (Math.random() - 0.5) * 0.1, w: 0.05 + Math.random() * 0.09, ph: Math.random() * 6, sp: 0.15 + Math.random() * 0.2 }));
  const specks = Array.from({ length: 34 }, () => ({ x: Math.random(), y: Math.random(), r: 0.6 + Math.random() * 1.4, sp: 0.004 + Math.random() * 0.01, ph: Math.random() * 6 }));
  const amb = Array.from({ length: 20 }, () => ({ x: Math.random(), y: Math.random(), r: 2 + Math.random() * 7, sp: 0.012 + Math.random() * 0.03, ph: Math.random() * 6 }));
  function drawBg(dt) {
    const w = bg.width, h = bg.height;
    bctx.clearRect(0, 0, w, h);
    bctx.globalCompositeOperation = 'lighter';
    for (const ray of rays) {
      const sway = reduced ? 0 : Math.sin(now * ray.sp + ray.ph);
      const x = (ray.x + sway * 0.03) * w, top = ray.w * w * 0.5, bot = ray.w * w * 2.4, drift = sway * w * 0.07;
      const a = 0.055 + (reduced ? 0 : 0.035 * Math.sin(now * ray.sp * 1.7 + ray.ph));
      const g = bctx.createLinearGradient(0, 0, 0, h * 0.8);
      g.addColorStop(0, `rgba(160,255,240,${a})`); g.addColorStop(1, 'rgba(160,255,240,0)');
      bctx.fillStyle = g;
      bctx.beginPath();
      bctx.moveTo(x - top / 2, 0); bctx.lineTo(x + top / 2, 0);
      bctx.lineTo(x + bot / 2 + drift, h * 0.8); bctx.lineTo(x - bot / 2 + drift, h * 0.8);
      bctx.closePath(); bctx.fill();
    }
    bctx.globalCompositeOperation = 'source-over';
    for (const s of specks) {
      if (!reduced) { s.y -= s.sp * dt; if (s.y < -0.02) { s.y = 1.02; s.x = Math.random(); } }
      bctx.fillStyle = `rgba(200,255,245,${0.18 + 0.12 * Math.sin(now * 2 + s.ph)})`;
      bctx.beginPath(); bctx.arc((s.x + Math.sin(now * 0.4 + s.ph) * 0.01) * w, s.y * h, s.r * dpr, 0, Math.PI * 2); bctx.fill();
    }
    bctx.lineWidth = 1.2 * dpr;
    for (const a of amb) {
      if (!reduced) { a.y -= a.sp * dt; if (a.y < -0.05) { a.y = 1.05; a.x = Math.random(); } }
      const x = (a.x + Math.sin(now * 0.6 + a.ph) * 0.01) * w, y = a.y * h, r = a.r * dpr;
      bctx.strokeStyle = 'rgba(234,251,246,.16)';
      bctx.beginPath(); bctx.arc(x, y, r, 0, Math.PI * 2); bctx.stroke();
      bctx.fillStyle = 'rgba(255,255,255,.22)';
      bctx.beginPath(); bctx.arc(x - r * 0.35, y - r * 0.35, r * 0.25, 0, Math.PI * 2); bctx.fill();
    }
  }

  function frame(t) {
    const dt = Math.min(0.05, (t - last) / 1000 || 0);
    last = t; now += dt;
    runChain();
    drawBg(dt);
    let sx = 0, sy = 0;
    if (shake > 0.2) { sx = (Math.random() - 0.5) * shake * 2; sy = (Math.random() - 0.5) * shake * 2; shake *= Math.exp(-dt * 7); } else shake = 0;
    ctx.setTransform(dpr, 0, 0, dpr, sx * dpr, sy * dpr);
    ctx.clearRect(-20, -20, W + 40, H + 40);

    // glass panel behind the bubbles
    const pg = ctx.createLinearGradient(0, oy, 0, oy + cell * rows);
    pg.addColorStop(0, 'rgba(255,255,255,.07)'); pg.addColorStop(1, 'rgba(0,12,22,.3)');
    ctx.fillStyle = pg;
    roundRect(ctx, ox - 6, oy - 6, cell * cols + 12, cell * rows + 12, cell * 0.5);
    ctx.fill();
    ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(255,255,255,.1)'; ctx.stroke();

    for (let c = 0; c < cols; c++) for (let r = 0; r < rows; r++) {
      const b = grid[c][r];
      if (!b || b.popped) continue;
      update(b, c, r, dt);
      drawBubble(b, dt);
    }

    ctx.globalCompositeOperation = 'lighter';
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      if (p.kind === 'flash') {
        p.life -= dt * 5;
        const a = Math.max(0, p.life);
        const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
        g.addColorStop(0, rgba(p.col, 0.8 * a)); g.addColorStop(1, rgba(p.col, 0));
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
      } else if (p.kind === 'ring') {
        p.life -= dt * 2.8; p.r += cell * 1.8 * dt;
        ctx.globalAlpha = Math.max(0, p.life) * 0.9;
        ctx.strokeStyle = p.col; ctx.lineWidth = cell * 0.06 * Math.max(0.2, p.life);
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.stroke();
      } else {
        p.life -= dt * p.decay;
        p.vx *= 1 - dt * 3; p.vy = p.vy * (1 - dt * 3) - cell * 2.2 * dt; // little bubbles float upward
        p.x += p.vx * dt; p.y += p.vy * dt;
        ctx.globalAlpha = Math.max(0, p.life);
        if (p.kind === 'spark') { p.rot += dt * 4; star(p.x, p.y, p.r * (0.5 + p.life * 0.5), p.rot, p.col); }
        else {
          ctx.fillStyle = p.col;
          ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
        }
      }
      if (p.life <= 0) parts.splice(i, 1);
    }
    ctx.globalCompositeOperation = 'source-over';

    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (let i = floats.length - 1; i >= 0; i--) {
      const f = floats[i];
      f.life -= dt * 0.9; f.y -= cell * 0.9 * dt;
      ctx.globalAlpha = Math.max(0, Math.min(1, f.life * 1.6));
      const size = Math.round(cell * 0.5 * f.size);
      ctx.font = `800 ${size}px ${DISPLAY}`;
      ctx.lineWidth = cell * 0.1; ctx.strokeStyle = 'rgba(4,20,30,.65)';
      ctx.strokeText(f.text, f.x, f.y);
      if (f.rainbow) {
        const wd = ctx.measureText(f.text).width;
        const g = ctx.createLinearGradient(f.x - wd / 2, 0, f.x + wd / 2, 0);
        RAINBOW_STOPS.forEach((col, k) => g.addColorStop(k / (RAINBOW_STOPS.length - 1), col));
        ctx.fillStyle = g;
      } else ctx.fillStyle = '#fff6da';
      ctx.fillText(f.text, f.x, f.y);
      if (f.life <= 0) floats.splice(i, 1);
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(frame);
  }

  // ---------- input ----------
  cv.addEventListener('pointerdown', e => {
    e.preventDefault();
    ac();
    const r = cv.getBoundingClientRect();
    const c = Math.floor((e.clientX - r.left - ox) / cell);
    const row = rows - 1 - Math.floor((e.clientY - r.top - oy) / cell);
    if (c >= 0 && c < cols && row >= 0 && row < rows) tap(c, row);
  });
  $('undoBtn').onclick = undo;
  $('ovUndo').onclick = undo;
  $('hintBtn').onclick = hint;
  $('rbBtn').onclick = () => setArmed(!armed);
  $('ovRainbow').onclick = () => { $('overlay').hidden = true; ended = false; setArmed(true); };
  $('restartBtn').onclick = () => { if (!busy) startLevel(level); };
  $('againBtn').onclick = () => startLevel(level);
  $('nextBtn').onclick = () => startLevel(level + 1);
  $('soundBtn').onclick = () => { save.sound = !save.sound; persist(); hud(); if (save.sound) note(7); };
  addEventListener('resize', layout);
  if (window.ResizeObserver) new ResizeObserver(layout).observe(wrap);

  // Keep the board as-is when the page is updated while open.
  window.claude?.hot?.snapshot?.(() => ({ level, score, g: colorsOf(), undoStack }));
  const boot = d => {
    if (d && d.g) {
      ({ nColors, cols, rows } = cfg(d.level));
      level = d.level; score = d.score; undoStack = d.undoStack || [];
      grid = fromColors(d.g);
      layout(); hud();
    } else startLevel(save.level || 1);
    persist();
    if (firstGift) tip('A gift: one rainbow bubble. Pop 12+ at once (a Tidal wave) to earn more.');
    requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });
  };
  window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
})();
</script>
