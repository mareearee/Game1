<title>Bubble Lagoon</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: one-screen phone app — name + stats strip, a board that fills the remaining height, a thumb-reach control bar. One deliberate dusky-lagoon look (single theme). */
:root{
  --deep:#0b2b36;
  --lagoon:#12505e;
  --shallow:#1d7f84;
  --foam:#eafbf6;
  --mist:rgba(234,251,246,.66);
  --sun:#ffd166;
  --panel:rgba(6,30,38,.5);
  --line:rgba(234,251,246,.16);
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{
  background:var(--deep);
  background-image:radial-gradient(130% 75% at 50% -5%,var(--shallow) 0%,var(--lagoon) 45%,var(--deep) 100%);
  color:var(--foam);font-family:var(--body);
  overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
}
#bg{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.app{
  position:relative;height:100%;box-sizing:border-box;
  display:flex;flex-direction:column;gap:10px;
  max-width:560px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:12px;
}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(1.55rem,6.5vw,2.1rem);line-height:1;margin:0;letter-spacing:-.01em}
h1 span{color:var(--sun)}
.stats{display:flex;gap:18px}
.stat{display:flex;flex-direction:column;align-items:flex-end}
.label{font-size:.66rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--mist)}
.num{font-family:var(--display);font-weight:800;font-size:1.4rem;line-height:1.1;font-variant-numeric:tabular-nums}
.info{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.86rem;color:var(--mist)}
.info b{color:var(--foam)}
.board{flex:1;min-height:0;position:relative}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
.bar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
button{
  font:800 .82rem var(--body);color:var(--foam);
  background:var(--panel);border:1px solid var(--line);border-radius:16px;
  padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;
  transition:transform .12s ease,opacity .2s;
}
button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
button:active{transform:scale(.94)}
button:disabled{opacity:.38}
button:focus-visible{outline:2px solid var(--sun);outline-offset:2px}

.overlay{
  position:fixed;inset:0;display:grid;place-items:center;
  background:rgba(4,20,26,.55);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
}
.card{
  width:100%;max-width:340px;box-sizing:border-box;text-align:center;
  background:linear-gradient(180deg,var(--lagoon),var(--deep));
  border:1px solid var(--line);border-radius:28px;padding:28px 22px 22px;
  box-shadow:0 24px 60px rgba(0,0,0,.4);
  animation:rise .45s cubic-bezier(.2,1.3,.4,1) both;
}
.card h2{font-family:var(--display);font-weight:800;font-size:2rem;line-height:1.05;margin:0;text-wrap:balance}
.card p{margin:8px 0 0;color:var(--mist);line-height:1.45}
.pearls{display:flex;gap:16px;justify-content:center;margin:20px 0 6px}
.pearl{width:38px;height:38px;border-radius:50%;background:rgba(234,251,246,.08);box-shadow:inset 0 0 0 2px rgba(234,251,246,.18)}
.pearl.on{
  background:radial-gradient(circle at 34% 30%,#fff 0 10%,#f7f0e8 28%,#ddcfc0 72%,#b8a594 100%);
  box-shadow:0 0 20px rgba(255,238,215,.5);
  animation:pearl .55s cubic-bezier(.2,1.6,.4,1) both;
}
.pearl.on:nth-child(2){animation-delay:.15s}
.pearl.on:nth-child(3){animation-delay:.3s}
.pearl-note{font-size:.8rem;color:var(--mist)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.actions button{flex-direction:row;justify-content:center;font-size:.95rem;padding:13px 8px}
.actions .primary{background:var(--sun);color:var(--deep);border-color:transparent}
.linkish{background:none;border:none;color:var(--mist);margin:12px auto 0;font-size:.85rem;padding:6px;text-decoration:underline;text-underline-offset:3px}

@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.94)}to{opacity:1;transform:none}}
@keyframes pearl{from{transform:scale(0)}to{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.card,.pearl.on{animation:none}}
</style>

<canvas id="bg" aria-hidden="true"></canvas>
<div class="app">
  <header class="top">
    <h1>Bubble <span>Lagoon</span></h1>
    <div class="stats">
      <div class="stat"><span class="label">Level</span><span class="num" id="lvl">1</span></div>
      <div class="stat"><span class="label">Score</span><span class="num" id="score">0</span></div>
    </div>
  </header>
  <div class="info">
    <span>Tap 2+ matching bubbles to pop them</span>
    <span><b id="left">0</b> left · best <b id="best">–</b></span>
  </div>
  <div class="board" id="board"><canvas id="cv" aria-label="Bubble board"></canvas></div>
  <nav class="bar">
    <button id="undoBtn" type="button"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>Undo</button>
    <button id="hintBtn" type="button"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></svg>Hint</button>
    <button id="restartBtn" type="button"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>Restart</button>
    <button id="soundBtn" type="button"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4z"/><g id="soundWaves"><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></g></svg><span id="soundLabel">Sound</span></button>
  </nav>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="card" role="dialog" aria-labelledby="ovTitle">
    <h2 id="ovTitle">Lagoon cleared!</h2>
    <p id="ovText">Every bubble popped.</p>
    <div class="pearls" id="pearls"><span class="pearl"></span><span class="pearl"></span><span class="pearl"></span></div>
    <div class="pearl-note" id="pearlNote">Clear the board for all 3 pearls</div>
    <div class="actions">
      <button id="againBtn" type="button">Play again</button>
      <button id="nextBtn" class="primary" type="button">Next level</button>
    </div>
    <button id="ovUndo" class="linkish" type="button">Undo last pop</button>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const cv = $('cv'), ctx = cv.getContext('2d'), wrap = $('board');
  const bg = $('bg'), bctx = bg.getContext('2d');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const KEY = 'bubble-lagoon-v1';

  const PAL = [
    { base: '#ff7a6b', light: '#ffd0c8', dark: '#c4413a' }, // coral
    { base: '#ffcf5a', light: '#fff3c7', dark: '#cf9214' }, // sunfish
    { base: '#4fe0a8', light: '#cbf9e6', dark: '#1a9a70' }, // sea glass
    { base: '#5ab6ff', light: '#d0eaff', dark: '#2270c0' }, // shallows
    { base: '#c794ff', light: '#eedcff', dark: '#8150c6' }, // anemone
  ];
  // Major pentatonic steps, so every pop chain sounds like a little tune.
  const SCALE = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24, 26, 28, 31, 33, 36];

  let save = { level: 1, best: {}, sound: true };
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && typeof s.level === 'number') save = Object.assign(save, s);
  } catch (e) {}
  const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(save)); } catch (e) {} };

  let level = 1, cols = 6, rows = 8, nColors = 3, grid = [], score = 0, undoStack = [];
  let busy = false, ended = false, chain = null, nextId = 1;
  let parts = [], floats = [], now = 0, last = 0;
  let W = 0, H = 0, cell = 40, ox = 0, oy = 0, dpr = 1;

  function rng(seed) {
    return () => {
      seed = seed + 0x6D2B79F5 | 0;
      let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function cfg(l) {
    const c = l <= 3 ? 6 : l <= 8 ? 7 : 8;
    return { nColors: l <= 2 ? 3 : l <= 5 ? 4 : 5, cols: c, rows: c + 2 };
  }
  function mk(color, c, r, fromTop) {
    return {
      id: nextId++, color, x: c,
      y: fromTop ? r + rows + 0.5 + Math.random() * 1.5 + c * 0.2 : r,
      vy: 0, scale: fromTop ? 1 : 0, phase: Math.random() * 6.28,
      squash: 0, wob: 0, hint: 0, popAt: 0, popIdx: 0, popped: false,
    };
  }
  const colorsOf = () => grid.map(col => col.map(b => b ? b.color : null));
  const fromColors = g => g.map((col, c) => col.map((k, r) => k === null ? null : mk(k, c, r, false)));

  function startLevel(l) {
    level = l;
    ({ nColors, cols, rows } = cfg(l));
    const R = rng(l * 7919 + 13);
    grid = [];
    for (let c = 0; c < cols; c++) {
      grid[c] = [];
      for (let r = 0; r < rows; r++) grid[c][r] = mk(Math.floor(R() * nColors), c, r, true);
    }
    score = 0; undoStack = []; ended = false; busy = false; chain = null; parts = []; floats = [];
    save.level = l; persist();
    $('overlay').hidden = true;
    layout(); hud();
  }

  // ---------- puzzle logic ----------
  const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  function findGroup(c, r) {
    const color = grid[c][r].color, seen = new Set([c * 100 + r]), out = [[c, r]];
    for (let i = 0; i < out.length; i++) {
      const [x, y] = out[i];
      for (const [dx, dy] of DIRS) {
        const nx = x + dx, ny = y + dy;
        if (nx < 0 || ny < 0 || nx >= cols || ny >= rows) continue;
        const b = grid[nx][ny];
        if (!b || b.color !== color || seen.has(nx * 100 + ny)) continue;
        seen.add(nx * 100 + ny); out.push([nx, ny]);
      }
    }
    return out; // breadth-first, so pops ripple outward from the tap
  }
  function hasMoves() {
    for (let c = 0; c < cols; c++) for (let r = 0; r < rows; r++) {
      const b = grid[c][r]; if (!b) continue;
      if (c + 1 < cols && grid[c + 1][r] && grid[c + 1][r].color === b.color) return true;
      if (r + 1 < rows && grid[c][r + 1] && grid[c][r + 1].color === b.color) return true;
    }
    return false;
  }
  const remaining = () => grid.reduce((n, col) => n + col.filter(Boolean).length, 0);
  function collapse() {
    for (let c = 0; c < cols; c++) {
      const col = grid[c].filter(Boolean);
      while (col.length < rows) col.push(null);
      grid[c] = col;
    }
    // Empty columns drift out to both sides so what's left gathers in the middle.
    const filled = grid.filter(col => col[0]);
    const empty = cols - filled.length, leftPad = Math.floor(empty / 2);
    const blank = () => Array(rows).fill(null);
    grid = [...Array.from({ length: leftPad }, blank), ...filled, ...Array.from({ length: empty - leftPad }, blank)];
  }

  function tap(c, r) {
    if (busy || ended) return;
    const b = grid[c] && grid[c][r];
    if (!b) return;
    const g = findGroup(c, r);
    if (g.length < 2) { b.wob = 1; boop(); return; }
    undoStack.push({ g: colorsOf(), score });
    if (undoStack.length > 80) undoStack.shift();
    busy = true;
    const step = Math.min(0.05, 0.7 / g.length);
    g.forEach(([x, y], i) => { const t = grid[x][y]; t.popAt = now + i * step; t.popIdx = i; });
    const gain = g.length * (g.length - 1) * 5;
    score += gain;
    floats.push({ x: px(b.x), y: py(b.y), text: '+' + gain, life: 1, size: 1 });
    if (g.length >= 15) floats.push({ x: px(b.x), y: py(b.y) - cell, text: 'Tidal wave!', life: 1.3, size: 1.5 });
    else if (g.length >= 9) floats.push({ x: px(b.x), y: py(b.y) - cell, text: 'Splash!', life: 1.2, size: 1.3 });
    chain = { cells: g, end: now + g.length * step + 0.08 };
    buzz(8); hud();
  }

  function runChain() {
    if (!chain) return;
    let all = true;
    for (const [x, y] of chain.cells) {
      const b = grid[x][y];
      if (!b || b.popped) continue;
      if (b.popAt <= now) { b.popped = true; burst(b); popNote(b.popIdx); }
      else all = false;
    }
    if (all && now >= chain.end) {
      for (const [x, y] of chain.cells) grid[x][y] = null;
      chain = null;
      collapse();
      busy = false;
      if (!hasMoves()) {
        ended = true;
        const left = remaining();
        if (left === 0) { score += 1000; floats.push({ x: W / 2, y: H / 2, text: '+1000', life: 1.4, size: 1.6 }); }
        hud();
        setTimeout(() => showEnd(left), left === 0 ? 1100 : 750);
        if (left === 0) setTimeout(chime, 250);
      } else hud();
    }
  }

  function undo() {
    if (busy || !undoStack.length) return;
    const s = undoStack.pop();
    grid = fromColors(s.g); score = s.score; ended = false;
    $('overlay').hidden = true;
    swish(); hud();
  }
  function hint() {
    if (busy || ended) return;
    let best = null;
    for (let c = 0; c < cols; c++) for (let r = 0; r < rows; r++) {
      if (!grid[c][r]) continue;
      const g = findGroup(c, r);
      if (g.length > 1 && (!best || g.length > best.length)) best = g;
    }
    if (best) for (const [x, y] of best) grid[x][y].hint = now + 1.6;
  }

  function showEnd(left) {
    const pearls = left === 0 ? 3 : left <= 3 ? 2 : left <= 8 ? 1 : 0;
    const prev = save.best[level] || { pearls: 0, score: 0 };
    save.best[level] = { pearls: Math.max(prev.pearls, pearls), score: Math.max(prev.score, score) };
    persist(); hud();
    $('ovTitle').textContent = left === 0 ? 'Lagoon cleared!' : pearls ? 'Nicely popped' : 'No more matches';
    $('ovText').textContent = left === 0
      ? 'Every bubble popped. +1,000 bonus.'
      : `${left} bubble${left === 1 ? '' : 's'} left drifting. Score ${score.toLocaleString()}.`;
    [...$('pearls').children].forEach((p, i) => p.classList.toggle('on', i < pearls));
    $('pearlNote').textContent = pearls === 3 ? 'All 3 pearls' : left <= 3 ? 'Clear every bubble for 3 pearls' : 'Leave 3 or fewer for 2 pearls · clear all for 3';
    $('overlay').hidden = false;
    $('nextBtn').focus({ preventScroll: true });
  }

  function hud() {
    $('lvl').textContent = level;
    $('score').textContent = score.toLocaleString();
    $('left').textContent = remaining();
    const b = save.best[level];
    $('best').textContent = b ? b.score.toLocaleString() : '–';
    $('undoBtn').disabled = !undoStack.length;
    $('soundWaves').innerHTML = save.sound
      ? '<path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/>'
      : '<path d="m22 9-6 6M16 9l6 6"/>';
    $('soundLabel').textContent = save.sound ? 'Sound' : 'Muted';
  }

  // ---------- sound ----------
  let actx = null;
  function ac() {
    if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
    if (actx.state === 'suspended') actx.resume();
    return actx;
  }
  function note(semi, delay = 0, dur = 0.22, type = 'sine', vol = 0.14, bend = 1.5) {
    if (!save.sound) return;
    const a = ac(); if (!a) return;
    const t = a.currentTime + delay, f = 392 * Math.pow(2, semi / 12);
    const o = a.createOscillator(), g = a.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f * bend, t);
    o.frequency.exponentialRampToValueAtTime(f, t + 0.035);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(a.destination);
    o.start(t); o.stop(t + dur + 0.03);
  }
  const popNote = i => note(SCALE[Math.min(i, SCALE.length - 1)], 0, 0.24, 'sine', 0.13, 1.8);
  const boop = () => note(-5, 0, 0.16, 'triangle', 0.07, 0.8);
  const swish = () => { note(7, 0, 0.12, 'sine', 0.06, 0.7); note(0, 0.06, 0.14, 'sine', 0.06, 0.7); };
  const chime = () => [0, 4, 7, 12, 16, 19, 24].forEach((s, i) => note(s + 5, i * 0.08, 0.5, 'sine', 0.09, 1));
  const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

  // ---------- drawing ----------
  const px = x => ox + (x + 0.5) * cell;
  const py = y => oy + (rows - 1 - y + 0.5) * cell;

  function layout() {
    const r = wrap.getBoundingClientRect();
    dpr = Math.min(2, window.devicePixelRatio || 1);
    W = r.width; H = r.height;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    cell = Math.min(W / cols, H / rows);
    ox = (W - cell * cols) / 2; oy = (H - cell * rows) / 2;
    bg.width = Math.round(innerWidth * dpr); bg.height = Math.round(innerHeight * dpr);
  }

  function burst(b) {
    const x = px(b.x), y = py(b.y), pal = PAL[b.color];
    parts.push({ ring: true, x, y, r: cell * 0.42, life: 1, col: pal.light });
    const n = reduced ? 4 : 9;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2 + Math.random() * 0.5, sp = cell * (1.6 + Math.random() * 2.2);
      parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: cell * (0.05 + Math.random() * 0.06), life: 1, col: pal.light, decay: 1.3 + Math.random() });
    }
  }

  function roundRect(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
  }

  function drawBubble(b, dt) {
    const pal = PAL[b.color], R = cell * 0.46;
    let s = b.scale;
    if (!reduced) s *= 1 + Math.sin(now * 1.7 + b.phase) * 0.022;
    let sx = s, sy = s;
    if (b.squash > 0) { sx *= 1 + 0.14 * b.squash; sy *= 1 - 0.14 * b.squash; b.squash = Math.max(0, b.squash - dt * 4); }
    if (b.wob > 0) { const w = Math.sin(b.wob * 22) * 0.1 * b.wob; sx *= 1 + w; sy *= 1 - w; b.wob = Math.max(0, b.wob - dt * 2.2); }
    if (b.hint > now) { const h = 1 + Math.abs(Math.sin(now * 7)) * 0.1; sx *= h; sy *= h; }
    if (b.popAt && !b.popped && chain) { const k = Math.max(0, 1 - (b.popAt - now) * 8); sx *= 1 + k * 0.15; sy *= 1 + k * 0.15; }
    const x = px(b.x), y = py(b.y);
    ctx.save();
    ctx.translate(x, y); ctx.scale(sx, sy);
    if (b.hint > now) { ctx.shadowColor = pal.light; ctx.shadowBlur = cell * 0.5; }
    const g = ctx.createRadialGradient(-R * 0.35, -R * 0.4, R * 0.08, 0, 0, R);
    g.addColorStop(0, pal.light); g.addColorStop(0.45, pal.base); g.addColorStop(1, pal.dark);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.lineWidth = R * 0.07; ctx.strokeStyle = 'rgba(255,255,255,.28)'; ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.78)';
    ctx.beginPath(); ctx.ellipse(-R * 0.33, -R * 0.4, R * 0.28, R * 0.16, -0.6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.35)';
    ctx.beginPath(); ctx.arc(R * 0.38, R * 0.34, R * 0.09, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function update(b, c, r, dt) {
    b.x += (c - b.x) * Math.min(1, dt * 9);
    if (Math.abs(c - b.x) < 0.002) b.x = c;
    if (b.y > r) {
      b.vy += 38 * dt;
      b.y -= b.vy * dt;
      if (b.y <= r) { b.y = r; if (b.vy > 4) b.squash = Math.min(1, b.vy / 14); b.vy = 0; }
    } else { b.y = r; b.vy = 0; }
    b.scale += (1 - b.scale) * Math.min(1, dt * 10);
  }

  // Ambient bubbles drifting up behind the board.
  const amb = Array.from({ length: 22 }, () => ({ x: Math.random(), y: Math.random(), r: 2 + Math.random() * 7, sp: 0.012 + Math.random() * 0.03, ph: Math.random() * 6 }));
  function drawBg(dt) {
    const w = bg.width, h = bg.height;
    bctx.clearRect(0, 0, w, h);
    bctx.lineWidth = 1.2 * dpr;
    for (const a of amb) {
      if (!reduced) { a.y -= a.sp * dt; if (a.y < -0.05) { a.y = 1.05; a.x = Math.random(); } }
      const x = (a.x + Math.sin(now * 0.6 + a.ph) * 0.01) * w, y = a.y * h;
      bctx.strokeStyle = 'rgba(234,251,246,.13)';
      bctx.beginPath(); bctx.arc(x, y, a.r * dpr, 0, Math.PI * 2); bctx.stroke();
    }
  }

  function frame(t) {
    const dt = Math.min(0.05, (t - last) / 1000 || 0);
    last = t; now += dt;
    runChain();
    drawBg(dt);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(4,24,31,.32)';
    roundRect(ctx, ox - 6, oy - 6, cell * cols + 12, cell * rows + 12, cell * 0.5);
    ctx.fill();

    for (let c = 0; c < cols; c++) for (let r = 0; r < rows; r++) {
      const b = grid[c][r];
      if (!b || b.popped) continue;
      update(b, c, r, dt);
      drawBubble(b, dt);
    }

    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      if (p.ring) {
        p.life -= dt * 3; p.r += cell * 1.6 * dt;
        ctx.globalAlpha = Math.max(0, p.life) * 0.8;
        ctx.strokeStyle = p.col; ctx.lineWidth = cell * 0.05;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.stroke();
      } else {
        p.life -= dt * p.decay;
        p.vx *= 1 - dt * 3; p.vy = p.vy * (1 - dt * 3) - cell * 2.2 * dt; // little bubbles float upward
        p.x += p.vx * dt; p.y += p.vy * dt;
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillStyle = p.col;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
      }
      if (p.life <= 0) parts.splice(i, 1);
    }

    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (let i = floats.length - 1; i >= 0; i--) {
      const f = floats[i];
      f.life -= dt * 0.9; f.y -= cell * 0.9 * dt;
      ctx.globalAlpha = Math.max(0, Math.min(1, f.life * 1.6));
      ctx.font = `800 ${Math.round(cell * 0.5 * f.size)}px ${getComputedStyle(document.documentElement).getPropertyValue('--display')}`;
      ctx.lineWidth = cell * 0.08; ctx.strokeStyle = 'rgba(6,30,38,.6)';
      ctx.strokeText(f.text, f.x, f.y);
      ctx.fillStyle = '#fff6da'; ctx.fillText(f.text, f.x, f.y);
      if (f.life <= 0) floats.splice(i, 1);
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(frame);
  }

  // ---------- input ----------
  cv.addEventListener('pointerdown', e => {
    e.preventDefault();
    ac();
    const r = cv.getBoundingClientRect();
    const c = Math.floor((e.clientX - r.left - ox) / cell);
    const row = rows - 1 - Math.floor((e.clientY - r.top - oy) / cell);
    if (c >= 0 && c < cols && row >= 0 && row < rows) tap(c, row);
  });
  $('undoBtn').onclick = undo;
  $('ovUndo').onclick = undo;
  $('hintBtn').onclick = hint;
  $('restartBtn').onclick = () => { if (!busy) startLevel(level); };
  $('againBtn').onclick = () => startLevel(level);
  $('nextBtn').onclick = () => startLevel(level + 1);
  $('soundBtn').onclick = () => { save.sound = !save.sound; persist(); hud(); if (save.sound) note(7); };
  addEventListener('resize', layout);
  if (window.ResizeObserver) new ResizeObserver(layout).observe(wrap);

  // Keep the board as-is when the page is updated while open.
  window.claude?.hot?.snapshot?.(() => ({ level, score, g: colorsOf(), undoStack }));
  const boot = d => {
    if (d && d.g) {
      ({ nColors, cols, rows } = cfg(d.level));
      level = d.level; score = d.score; undoStack = d.undoStack || [];
      grid = fromColors(d.g);
      layout(); hud();
    } else startLevel(save.level || 1);
    requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });
  };
  window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
})();
</script>
